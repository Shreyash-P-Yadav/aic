[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insight-copilot"
version = "0.1.0"
description = "Insight Copilot - a KPI intelligence-to-action engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "duckdb>=1.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "ruptures>=1.1.9",
  "rank-bm25>=0.2.2",
  "pyyaml>=6.0",
  "python-dateutil>=2.9",
  "holidays>=0.45",
  "anthropic>=0.25",
  "httpx>=0.27",
  "orjson>=3.10",
  "structlog>=24.1",
  "pyarrow>=15.0",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.100",
  "ruff>=0.4",
  "mypy>=1.10",
  "pandas-stubs",
  "types-PyYAML",
  "types-python-dateutil",
]
# Optional, feature-flagged. MUST NOT be required to run.
dense = ["sentence-transformers>=2.7"]
nli = ["transformers>=4.40", "torch>=2.2"]

[project.scripts]
insight-copilot = "insight_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
insight_copilot = ["py.typed", "**/*.yaml", "**/*.yml"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_any_unimported = false
mypy_path = "src"
packages = ["insight_copilot"]
plugins = []

[[tool.mypy.overrides]]
module = [
  "statsmodels.*", "lightgbm.*", "ruptures.*", "rank_bm25.*",
  "duckdb.*", "holidays.*", "sklearn.*", "scipy.*", "structlog.*",
]
ignore_missing_imports = true
